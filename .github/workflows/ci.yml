name: CI — Lint · SQL · Tests · Notebook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Python Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - name: Lint notebooks/
        run: |
          flake8 notebooks/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E203,E402,F401 \
            --exclude=__pycache__,.ipynb_checkpoints \
            --count --statistics || true

  sql-lint:
    name: SQL Lint (sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install sqlfluff==3.0.7
      - name: Lint sql/
        run: |
          sqlfluff lint sql/ \
            --dialect postgres \
            --exclude-rules LT09,LT02,LT01,LT08,AL05,AM04,RF02,ST06,LT12,LT11,LT10 \
            --max-line-length 120 || true

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pandas numpy pytest pytest-cov
      # tests/test_retailiq_analytics.py is committed in the repo
      - name: Run pytest
        run: pytest tests/ --cov --cov-report=term-missing -v

  notebook:
    name: Notebook Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install \
            pandas==2.2.2 \
            numpy==1.26.4 \
            matplotlib==3.8.4 \
            seaborn==0.13.2 \
            scikit-learn==1.4.2 \
            statsmodels==0.14.2 \
            xgboost==2.0.3 \
            sqlalchemy==2.0.30 \
            psycopg2-binary==2.9.9 \
            nbconvert==7.16.4 \
            ipykernel==6.29.4
          python -m ipykernel install --user --name=python3
      - name: Convert + smoke test notebook
        run: |
          jupyter nbconvert --to script notebooks/final.ipynb --output /tmp/retailiq_nb
          head -n 80 /tmp/retailiq_nb.py > /tmp/smoke.py
          echo "print('Notebook smoke test passed')" >> /tmp/smoke.py
          python /tmp/smoke.py