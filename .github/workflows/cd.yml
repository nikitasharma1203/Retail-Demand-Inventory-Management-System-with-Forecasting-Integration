name: Build Check — React Web App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: npm install + npm run build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Dynamically find where package.json lives — works regardless of folder name
      - name: Find React app folder
        id: find
        run: |
          PKG=$(find . -name "package.json" \
            -not -path "*/node_modules/*" \
            -not -path "*/.github/*" \
            | head -1)
          DIR=$(dirname "$PKG")
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Found React app at: $DIR"
          ls "$DIR"

      - name: Install dependencies
        run: npm install
        working-directory: ${{ steps.find.outputs.dir }}

      - name: Build React app
        run: npm run build
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          CI: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build-${{ github.sha }}
          path: ${{ steps.find.outputs.dir }}/build/
          retention-days: 7