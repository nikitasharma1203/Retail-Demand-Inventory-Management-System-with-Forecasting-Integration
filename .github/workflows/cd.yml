# ─────────────────────────────────────────────────────────────────────────────
# RetailIQ — Build Check (v3 — correct React app folder: retail-dashboard/)
# ─────────────────────────────────────────────────────────────────────────────

name: Build Check — React Web App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build:
    name: npm install + npm run build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # React app lives in retail-dashboard/ (confirmed from repo structure)
      - name: Install dependencies
        working-directory: retail-dashboard
        run: npm install

      - name: Build React app
        working-directory: retail-dashboard
        run: npm run build
        env:
          CI: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build-${{ github.sha }}
          path: retail-dashboard/build/
          retention-days: 7